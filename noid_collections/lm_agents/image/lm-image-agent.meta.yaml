id: lm:image-agent
name: Image Agent
description: Generates images from a rendered prompt template with a pluggable text-to-image
  model (Janus-Pro by default), saving PNG files and publishing their paths.
properties:
  backend:
    description: 'Image backend: ''janus'', ''diffusers'', or a custom ImageBackend
      subclass as ''package.module:ClassName''.'
    default: janus
    required: false
  model:
    description: Model id for the backend (e.g. a Hugging Face repo id). Empty uses
      the backend default.
    default: ''
    required: false
  device:
    description: '''auto'', ''cpu'', or ''cuda''. ''auto'' uses a GPU only if it has
      enough memory.'
    default: auto
    required: false
  dtype:
    description: Torch dtype name ('bfloat16', 'float16', 'float32') or 'auto' for
      the backend default.
    default: auto
    required: false
  prompt_template:
    description: Prompt template. Supports {{input}}, {{question}}, flat message keys
      as {{key}}, and dot-separated paths into nested fields as {{row.name}}. Append
      a style here, e.g. '{{input}}, simple colored drawing, white background'.
    default: '{{input}}'
    required: false
    kind: text
  num_images:
    description: Number of images generated per prompt (one batch).
    default: 1
    required: false
  guidance_scale:
    description: 'Classifier-free guidance scale; higher follows the prompt more closely.
      Unset uses the backend default (Janus: 5.0).'
    required: true
  seed:
    description: Random seed for reproducible images. Unset for random.
    required: true
  options:
    description: 'Backend-specific options as a JSON object, e.g. {"temperature":
      1.0} for janus or {"num_inference_steps": 1, "width": 512} for diffusers.'
    default: ''
    required: false
    kind: text
  output_dir:
    description: Directory where generated PNG files are written (created if missing).
    default: output/images
    required: false
    kind: resource
  embed:
    description: Also include each image as a base64 data URL (data_url) in the output.
    default: false
    required: false
  csv_field:
    description: 'Field name added directly below `row` (no dotted paths). Setting
      this property switches the component into CSV mode: `schema` and `row` notices
      are handled, and the `document` output carries the enriched input dict instead
      of {content, images, ...}. The field holds the image path, or a JSON list of
      paths when num_images > 1. Must not be set for plain, non-CSV usage — it has
      no default value.'
    required: true
  error_mode:
    description: 'Behavior when generation fails: ''fallback_value'' or ''propagate''.'
    default: fallback_value
    required: false
  error_fallback_value:
    description: Value written to the output field when error_mode is 'fallback_value'
      and generation fails.
    default: IMAGE_ERROR
    required: false
input_notices:
  input:
    description: 'Triggers image generation on a single item. Payload keys: content
      (str), question (str, optional). Also accepts a plain string.'
  schema:
    description: 'CSV column schema. Payload keys: label (optional), columns (list
      of str). Ignored if `csv_field` is not set.'
  row:
    description: 'One CSV row. Payload keys: label (optional), index (optional), row
      (dict). Ignored if `csv_field` is not set.'
output_notices:
  document:
    description: 'Generated image(s) for a single item. When csv_field is set: enriched
      input dict. Otherwise: {content (str, path of the first image or the fallback
      value), images (list of {file, data_url?}), prompt (str), model (str), backend
      (str)}.'
  schema:
    description: Input schema with csv_field appended to columns. Emitted in response
      to the schema notice.
  row:
    description: Input row with the image path(s) added under row[csv_field]. label/index
      are passed through unchanged.

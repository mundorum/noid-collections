id: data:progress-tracker
name: Progress Tracker
description: Forwards uncheckpointed rows and persists identifiers in a separate append-only
  journal.
properties:
  state_file:
    description: Path to the UTF-8 checkpoint journal (one identifier per line), separate
      from result files.
    default: progress.keys
    required: false
    kind: resource
  identifier_path:
    description: Dotted path containing a stable identifier (for example 'row.id').
      'index' is safe only with immutable row order.
    default: index
    required: false
input_notices:
  schema:
    description: Schema notice to forward; it never changes the checkpoint journal
      path.
  row:
    description: Incoming row to check. Completed rows are skipped; other rows are
      forwarded.
  checkpoint:
    description: Success acknowledgement containing the same identifier as the forwarded
      row.
output_notices:
  schema:
    description: Publishes the schema notice downstream unchanged.
  forward:
    description: Forwards a row whose identifier is not checkpointed.
  skipped:
    description: Publishes a row whose identifier is already checkpointed.
  checkpoint_recorded:
    description: Emitted only after the identifier is durably appended.
  error:
    description: 'A checkpoint could not be persisted. Payload keys: error, key.'
